<!DOCTYPE html>
<html lang="ja" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BOPS PPT 明細 — 当日/当週/当月</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, html[data-theme="dark"] {
    --primary:#0C5CAB; --primary-2:#2f81d6; --surface:#09090b; --panel:#101014; --panel-2:#16161c;
    --border:rgba(255,255,255,.08); --text:#fafafa; --muted:#a1a1aa; --muted-2:#71717a;
    --excluded:#26262b; --break:#3a2f12; --shadow:0 8px 24px rgba(0,0,0,.45);
  }
  html[data-theme="light"] {
    --surface:#eef2f7; --panel:#fff; --panel-2:#f3f6fb; --border:rgba(20,40,80,.12);
    --text:#1c2430; --muted:#5b6675; --muted-2:#8a94a6; --excluded:#f0f0f3; --break:#fff7e0;
    --shadow:0 8px 24px rgba(20,40,80,.08);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--surface); color:var(--text);
         font-family:"IBM Plex Sans JP","IBM Plex Sans",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1500px; margin:0 auto; padding:24px 20px 48px; }
  .head { display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .logo { width:36px; height:36px; border-radius:9px; flex:0 0 auto;
          background:linear-gradient(135deg,var(--primary),var(--primary-2));
          display:grid; place-items:center; font-weight:700; color:#fff; }
  h1 { margin:0; font-size:19px; font-weight:600; }
  .sub { font-size:12px; color:var(--muted); margin-top:2px; }
  .right { margin-left:auto; display:flex; gap:10px; align-items:center; }
  .btn { border:1px solid var(--border); background:var(--panel); color:var(--text);
         border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; text-decoration:none; font-family:inherit; }
  .btn:hover { border-color:var(--primary-2); }
  .toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .seg { display:inline-flex; background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:4px; gap:4px; }
  .seg-btn { border:0; background:transparent; color:var(--muted); font-weight:600; font-size:13px;
             font-family:inherit; padding:7px 18px; border-radius:7px; cursor:pointer; }
  .seg-btn.active { background:linear-gradient(180deg,var(--primary),#0a4a8a); color:#fff; }
  .search { flex:1; min-width:200px; max-width:360px; padding:8px 12px; border-radius:8px;
            border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:13px; font-family:inherit; }
  .count { font-size:12px; color:var(--muted); }
  .tablewrap { overflow:auto; border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); }
  table { width:100%; border-collapse:collapse; font-size:12.5px; white-space:nowrap; }
  thead th { position:sticky; top:0; background:var(--panel-2); color:var(--muted); text-align:left;
             padding:10px 12px; border-bottom:1px solid var(--border); font-weight:600; cursor:pointer; user-select:none; }
  thead th:hover { color:var(--text); }
  thead th.sorted::after { content:attr(data-dir); margin-left:4px; color:var(--primary-2); }
  tbody td { padding:8px 12px; border-bottom:1px solid var(--border); }
  tbody tr:hover { background:rgba(127,127,127,.06); }
  tr.excluded td { background:var(--excluded); color:var(--muted); }
  tr.brk td.brkcell { background:var(--break); }
  a.issue { color:var(--accent,#7aa2ff); text-decoration:none; white-space:nowrap; }
  a.issue:hover { text-decoration:underline; }
  .topic { max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:600;
           background:rgba(127,127,127,.16); color:var(--muted); }
  .footer { margin-top:16px; font-size:11.5px; color:var(--muted-2); line-height:1.7; }
  .btn:disabled { opacity:.45; cursor:default; border-color:var(--border); }
  .btn.primary { background:linear-gradient(180deg,var(--primary),#0a4a8a); color:#fff; border-color:transparent; }
  .dl { border:1px solid var(--border); background:var(--panel-2); color:var(--text); border-radius:6px;
        padding:2px 9px; font-size:12px; cursor:pointer; font-family:inherit; }
  .dl:hover { border-color:var(--primary-2); }
  .dl:disabled { opacity:.5; cursor:default; }
  .nofile { color:var(--muted-2); }
  .bulkmsg { font-size:12px; color:var(--muted); }
  dialog.pw { border:1px solid var(--border); border-radius:12px; background:var(--panel); color:var(--text);
              padding:20px 22px; width:min(380px, calc(100vw - 32px)); box-shadow:var(--shadow); }
  dialog.pw::backdrop { background:rgba(0,0,0,.5); }
  dialog.pw h2 { margin:0 0 6px; font-size:15px; }
  dialog.pw p { margin:0 0 12px; font-size:12px; color:var(--muted); line-height:1.6; }
  dialog.pw input { width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
                    background:var(--panel-2); color:var(--text); font-size:13px; font-family:inherit; }
  dialog.pw .err { color:#f87171; font-size:12px; min-height:18px; margin-top:6px; }
  dialog.pw .acts { display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
  @media(max-width:640px){ .topic{max-width:160px;} }
</style></head>
<body><div class="wrap">
  <div class="head">
    <div class="logo">P</div>
    <div><h1>BOPS PPT 生成明細</h1><div class="sub" id="sub">読み込み中…</div></div>
    <div class="right">
      <a class="btn" href="./index.html">← ダッシュボード</a>
      <button class="btn" id="themeBtn" title="テーマ切替">🌙</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="seg" id="seg">
      <button class="seg-btn active" data-k="daily">当日</button>
      <button class="seg-btn" data-k="weekly">当週</button>
      <button class="seg-btn" data-k="monthly">当月</button>
    </div>
    <input class="search" id="search" placeholder="トピック / ユーザー / 会社 で絞り込み…">
    <span class="count" id="count"></span>
    <button class="btn primary" id="bulkBtn" hidden>一括ダウンロード</button>
    <span class="bulkmsg" id="bulkMsg"></span>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="footer" id="foot"></div>
</div>
<dialog class="pw" id="pwDlg">
  <form method="dialog" id="pwForm">
    <h2>ダウンロード用の口令</h2>
    <p>PPT は暗号化して置いてあり、このブラウザ内で復号します。口令はページを閉じるまで保持し、どこにも送信・保存しません。</p>
    <input type="password" id="pwInput" autocomplete="off" placeholder="口令">
    <div class="err" id="pwErr"></div>
    <div class="acts">
      <button class="btn" type="button" id="pwCancel">キャンセル</button>
      <button class="btn primary" type="submit" id="pwOk">OK</button>
    </div>
  </form>
</dialog>
<script>
// 列定義（Excel 明細に準拠）。key は detail.json の各レコードのフィールド。
const COLS = [
  {k:'id', label:'ID', num:true},
  {k:'topic', label:'トピック', cls:'topic'},
  {k:'dl', label:'DL', dl:true, nosort:true},
  {k:'username', label:'ユーザー'},
  {k:'company', label:'会社'},
  {k:'strategy', label:'戦略'},
  {k:'status', label:'状態', badge:true},
  {k:'issue', label:'Issue', link:true},
  {k:'slideCount', label:'スライド数(一覧)', num:true},
  {k:'actualSlides', label:'実際', num:true},
  {k:'statSlides', label:'統計用', num:true},
  {k:'createdAt', label:'作成日時'},
  {k:'startTime', label:'開始'},
  {k:'endTime', label:'終了'},
  {k:'durationSec', label:'所要(秒)', num:true, brk:true},
  {k:'mmss', label:'mm:ss', brk:true},
  {k:'logsCount', label:'ログ件数', num:true},
  {k:'avgPerSlide', label:'平均秒/頁', num:true, brk:true},
  {k:'reason', label:'未做成原因'},
  {k:'breakCount', label:'中断回数', num:true},
  {k:'maxGapSec', label:'最大中断(秒)', num:true},
];

let DATA = {daily:[], weekly:[], monthly:[]}, META = {};
let cur = 'daily', sortKey = 'id', sortDir = -1, query = '';

function applyTheme(t){
  document.documentElement.dataset.theme = t;
  document.getElementById('themeBtn').textContent = t==='dark'?'🌙':'☀️';
  try{ localStorage.setItem('bops_theme', t); }catch(e){}
}
document.getElementById('themeBtn').onclick = ()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

function rows(){
  let r = (DATA[cur]||[]).slice();
  if(query){
    const q = query.toLowerCase();
    r = r.filter(x => [x.topic,x.username,x.company,x.strategy,x.issueNo&&('#'+x.issueNo)].some(v => (v||'').toLowerCase().includes(q)));
  }
  r.sort((a,b)=>{
    let va=a[sortKey], vb=b[sortKey];
    if(typeof va==='number'||typeof vb==='number'){ va=+va||0; vb=+vb||0; return (va-vb)*sortDir; }
    return String(va||'').localeCompare(String(vb||''))*sortDir;
  });
  return r;
}

function renderHead(){
  document.getElementById('thead').innerHTML = COLS.map(c=>{
    const sorted = c.k===sortKey;
    return `<th data-k="${c.k}" class="${sorted?'sorted':''}" data-dir="${sorted?(sortDir>0?'▲':'▼'):''}">${c.label}</th>`;
  }).join('');
  document.querySelectorAll('#thead th').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(COLS.find(c=>c.k===k).nosort) return;
    if(k===sortKey) sortDir*=-1; else { sortKey=k; sortDir = COLS.find(c=>c.k===k).num?-1:1; }
    render();
  });
}

function render(){
  renderHead();
  const r = rows();
  document.getElementById('tbody').innerHTML = r.map(x=>{
    const ex = x.excluded ? 'excluded':'';
    const bk = (x.breakCount>0) ? 'brk':'';
    return `<tr class="${ex} ${bk}">` + COLS.map(c=>{
      let v = x[c.k]; if(v===undefined||v===null) v='';
      const cls = (c.num?'num ':'') + (c.cls||'') + (c.brk&&bk?' brkcell':'');
      if(c.dl){
        const f = fileOf(x);
        if(!f) return `<td class="${cls}"><span class="nofile">—</span></td>`;
        return `<td class="${cls}"><button class="dl" data-id="${esc(String(x.id))}" title="${esc(f.n)}（${kb(f.s)}）" aria-label="ダウンロード: ${esc(f.n)}">⬇</button></td>`;
      }
      if(c.link){
        if(!x.issueUrl) return `<td class="${cls}"></td>`;
        const t = `${x.issueState||''} ${x.issueDate||''}`.trim();
        return `<td class="${cls}"><a class="issue" href="${x.issueUrl}" target="_blank" rel="noopener" title="${t}">#${x.issueNo}${x.issueKind?' '+x.issueKind:''}</a></td>`;
      }
      if(c.badge) v = `<span class="badge">${v||'—'}</span>`;
      else if(c.cls==='topic') return `<td class="${cls}" title="${String(v).replace(/"/g,'&quot;')}">${v}</td>`;
      return `<td class="${cls}">${v}</td>`;
    }).join('') + `</tr>`;
  }).join('') || `<tr><td colspan="${COLS.length}" style="padding:20px;color:var(--muted)">該当データなし</td></tr>`;
  const total=(DATA[cur]||[]).length, shown=r.length, exn=(DATA[cur]||[]).filter(x=>x.excluded).length;
  document.getElementById('count').textContent = `${shown}/${total} 件表示${query?'（絞込中）':''} · 未生成 ${exn} 件`;
  document.querySelectorAll('#tbody button.dl').forEach(b=>b.onclick=()=>downloadOne(b));
  const nf = r.filter(fileOf).length, bb = document.getElementById('bulkBtn');
  bb.hidden = !FILES.ready;
  if(!BUSY){ bb.disabled = nf===0; bb.textContent = `一括ダウンロード（${nf} 件）`; }
}

// ---- PPT ダウンロード（docs/files/ の暗号化 PPTX をブラウザ内で復号）----
//   files/index.json: {files:{id:{m:月,n:ファイル名,s:サイズ}}} / files/meta.json: PBKDF2 salt・反復回数・口令確認用 check
//   暗号化は scripts/encrypt_files.py（CI の PPT_FILE_KEY）。保存は当月＋前月、旧方式（テンプレート）PPT はファイルなし。
const FILES = {ready:false, idx:{}, meta:null, key:null};
let BUSY = false;
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const kb = n => n>=1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB';
const fileOf = x => FILES.ready ? FILES.idx[String(x.id)] : null;
const b64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));

async function deriveKey(pw){
  const m = FILES.meta;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(m.salt), iterations:m.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const c = b64(m.check);
  await crypto.subtle.decrypt({name:'AES-GCM', iv:c.slice(0,12)}, key, c.slice(12));  // 口令違いはここで例外
  return key;
}
function getKey(){
  if(FILES.key) return Promise.resolve(FILES.key);
  const dlg = document.getElementById('pwDlg'), inp = document.getElementById('pwInput'), err = document.getElementById('pwErr');
  return new Promise(resolve=>{
    err.textContent = ''; inp.value = '';
    document.getElementById('pwCancel').onclick = ()=>{ dlg.close(); resolve(null); };
    document.getElementById('pwForm').onsubmit = async ev=>{
      ev.preventDefault();
      const pw = inp.value; if(!pw) return;
      document.getElementById('pwOk').disabled = true; err.textContent = '確認中…';
      try{ FILES.key = await deriveKey(pw); dlg.close(); resolve(FILES.key); }
      catch(e){ err.textContent = '口令が違います'; inp.select(); }
      finally{ document.getElementById('pwOk').disabled = false; }
    };
    dlg.oncancel = ()=>resolve(null);
    dlg.showModal(); inp.focus();
  });
}
async function fetchPlain(id, key){
  const f = FILES.idx[id];
  const r = await fetch(`./files/${f.m}/${id}.enc`);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  const buf = new Uint8Array(await r.arrayBuffer());
  return crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(0,12)}, key, buf.slice(12));
}
function saveBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
}
const PPTX = 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
async function downloadOne(btn){
  const id = btn.dataset.id, key = await getKey(); if(!key) return;
  btn.disabled = true; btn.textContent = '…';
  try{ saveBlob(new Blob([await fetchPlain(id, key)], {type:PPTX}), FILES.idx[id].n); btn.textContent = '⬇'; }
  catch(e){ btn.textContent = '⚠'; btn.title = '取得に失敗しました: '+e.message; }
  finally{ btn.disabled = false; }
}
function loadJSZip(){
  if(window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((ok, ng)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.integrity = 'sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==';
    s.crossOrigin = 'anonymous'; s.referrerPolicy = 'no-referrer';
    s.onload = ()=>ok(window.JSZip); s.onerror = ()=>ng(new Error('JSZip の読み込みに失敗'));
    document.head.appendChild(s);
  });
}
async function downloadBulk(){
  const list = rows().filter(fileOf); if(!list.length || BUSY) return;
  const key = await getKey(); if(!key) return;
  const bb = document.getElementById('bulkBtn'), msg = document.getElementById('bulkMsg');
  BUSY = true; bb.disabled = true; msg.textContent = '';
  try{
    const JSZip = await loadJSZip(), zip = new JSZip(), used = new Set(), failed = [];
    let done = 0;
    for(const x of list){
      const f = fileOf(x);
      bb.textContent = `作成中 ${++done}/${list.length}…`;
      try{
        const base = `${String(x.createdAt||'').slice(0,10).replace(/-/g,'')}_${x.username||'unknown'}_${f.n}`.replace(/[\\/:*?"<>|]/g,'_');
        let name = base, i = 2;
        while(used.has(name)) name = base.replace(/(\.pptx)?$/i, `_${i++}$1`);
        used.add(name);
        zip.file(name, await fetchPlain(String(x.id), key));
      }catch(e){ failed.push(f.n); }
    }
    const ok = list.length - failed.length;
    if(ok){
      const tab = {daily:'当日', weekly:'当週', monthly:'当月'}[cur] || cur;
      const blob = await zip.generateAsync({type:'blob'});
      saveBlob(blob, `BOPS_PPT_${(META.date||'').replace(/-/g,'')}_${tab}${query?'_絞込':''}_${ok}件.zip`);
    }
    msg.textContent = failed.length ? `${failed.length} 件は取得できませんでした: ${failed.join('、')}` : '';
  }catch(e){ msg.textContent = '一括ダウンロードに失敗しました: '+e.message; }
  finally{ BUSY = false; render(); }
}
document.getElementById('bulkBtn').onclick = downloadBulk;

document.querySelectorAll('#seg .seg-btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#seg .seg-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); cur=b.dataset.k; query=''; document.getElementById('search').value=''; render();
});
document.getElementById('search').oninput = e=>{ query=e.target.value.trim(); render(); };

(function init(){
  let t='dark'; try{ t=localStorage.getItem('bops_theme')||'dark'; }catch(e){}
  applyTheme(t);
  const FOOT = `※ 灰色行＝統計上の未生成（status 空/created かつ logsCount≤1）。黄色セル＝中断（log 間隔 ≥ 1 時間）あり。`+
      `列は Excel 明細に準拠。列ヘッダクリックでソート。<br>`+
      `※ DL＝生成された PPTX のダウンロード（初回のみ口令を入力、ブラウザ内で復号）。「一括ダウンロード」は表示中（タブ＋絞り込み）の行を ZIP にまとめる。`+
      `ファイルは当月と前月分のみ。旧方式（テンプレート選択）の PPT は BOPS にファイルが無いため「—」。`;
  const qMonth = new URLSearchParams(location.search).get('month');
  const fail = ()=>{
    document.getElementById('sub').textContent = 'データの読み込みに失敗しました';
    document.getElementById('tbody').innerHTML = `<tr><td colspan="${COLS.length}" style="padding:20px;color:var(--muted)">データ未生成（CI 実行後に表示されます）</td></tr>`;
    renderHead();
  };
  // 起票 issue の紐付け（dy-ppt-quality-monitor が run 後に docs/data/ へ push する）
  //   issue_links.json : BOPS id → issue（2026-09-11 以降、起票/追記時に helper が記録）
  //   issues.json      : 「ユーザー|主題キー」→ issue（監視の重複判定 state。過去分の兜底）
  const loadJson = u => fetch(u+'?_='+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({}));
  let LINKS={}, ISSUES={};
  // 主題キーは監視側の生成が 6〜16 文字とブレるため、同一ユーザー内で前方一致すれば紐付ける
  const norm = t => String(t||'').replace(/[\s\p{P}\p{S}]/gu,'');
  let IDX = {};   // user → [{key, link}]
  function buildIdx(){ IDX={}; for(const k in ISSUES){ const i=k.indexOf('|'); if(i<0) continue;
    const u=k.slice(0,i).trim(), tk=norm(k.slice(i+1)); (IDX[u]=IDX[u]||[]).push({tk, l:ISSUES[k]}); } }
  function fuzzy(x){ const c=IDX[(x.username||'').trim()]; if(!c) return null; const t=norm(x.topic);
    for(const {tk,l} of c){ if(tk.length>=6 && (t.startsWith(tk) || tk.startsWith(t.slice(0,Math.max(6,tk.length))))) return l; } return null; }
  function annotate(list){
    for(const x of (list||[])){
      const l = LINKS[String(x.id)] || fuzzy(x);
      if(!l) continue;
      x.issueUrl=l.url||l.issue_url; x.issueNo=l.issue||l.issue_number||((String(x.issueUrl).match(/issues\/(\d+)/)||[])[1]); x.issueKind=l.kind||'';
      x.issueState=l.state||''; x.issueDate=l.date||l.last_seen||'';
    }
    return list;
  }
  Promise.all([loadJson('./data/detail.json'), loadJson('./data/issue_links.json'), loadJson('./data/issues.json'),
               loadJson('./files/index.json'), loadJson('./files/meta.json')]).then(([d,l,i,fi,fm])=>{
    LINKS=l||{}; ISSUES=i||{}; buildIdx();
    if(fi && fi.files && fm && fm.salt && window.crypto && crypto.subtle){
      FILES.idx = fi.files; FILES.meta = fm; FILES.ready = true;
    }
    META = d;
    if(qMonth && qMonth !== (d.date||'').slice(0,7)){
      // 過去月アーカイブ表示: 月次明細のみ（当日/当週タブは非表示）
      return fetch('./data/archive/'+qMonth+'.json?_='+Date.now()).then(r=>r.json()).then(a=>{
        DATA = {daily:[], weekly:[], monthly:annotate(a.detail||[])};
        cur = 'monthly';
        document.querySelectorAll('#seg .seg-btn').forEach(b=>{
          b.classList.toggle('active', b.dataset.k==='monthly');
          if(b.dataset.k!=='monthly') b.style.display='none';
        });
        const back = document.createElement('a');
        back.className='btn'; back.href='./detail.html'; back.textContent='最新の明細へ';
        document.querySelector('.right').prepend(back);
        document.getElementById('sub').textContent =
          `${qMonth} 月間明細（${a.date} 集計）｜ ${DATA.monthly.length} 件`;
        document.getElementById('foot').innerHTML = FOOT;
        render();
      });
    }
    DATA = {daily:annotate(d.daily||[]), weekly:annotate(d.weekly||[]), monthly:annotate(d.monthly||[])};
    document.getElementById('sub').textContent =
      `基準日 ${d.date||'?'} ｜ 当日 ${DATA.daily.length} 件 / 当週 ${DATA.weekly.length} 件 / 当月 ${DATA.monthly.length} 件`;
    document.getElementById('foot').innerHTML = FOOT;
    render();
  }).catch(fail);
})();
</script>
</body></html>
