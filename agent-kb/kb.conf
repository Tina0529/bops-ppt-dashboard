# 轮换与运行参数（被 bin/lib.sh 读取，shell 语法）

# 会话轮换阈值：满足任一条件就让旧会话写交接、下次新开一任
ROTATE_MAX_EVENTS=30        # 一任处理的事件数上限
ROTATE_IDLE_DAYS=3          # 闲置超过 N 天，下一个事件来时先交接再新开
ROTATE_CTX_TOKENS=120000    # 最近一次调用的上下文 token 数超过这个值就轮换（避开自动压缩）

# agent 可用工具白名单。要放开发消息、发邮件等动作，先在 _topics.md 的 auto 列声明，再加到这里
TOOLS="Read,Write,Edit,Glob,Grep,Bash(mv:*),Bash(mkdir:*),Bash(date:*),Bash(ls:*)"

# CLAUDE_BIN=claude          # 换成 mock 可以不花钱跑通流程：CLAUDE_BIN=bin/mock_claude.sh
# CLAUDE_MODEL=              # 留空用默认；topic agent 可指定更强的模型
