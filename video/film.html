<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大模型推理动画</title>
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/600.css">
<style>
:root{
  --bg:#0B0F19; --paper:#141A28; --paper-2:#0F1522; --ink:#E8EBF2; --ink-2:#C4CAD7; --muted:#8B94A8;
  --line:#232C3F; --line-2:#36425C; --vec:#95A2FF; --vec-soft:#1C2245; --att:#FFB04A; --att-soft:#36260F;
  --chip-s:48%; --chip-bg-l:21%; --chip-bd-l:40%; --chip-fg-l:87%; --chip-solid-l:58%;
}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;color:var(--ink);font-family:"Noto Sans SC",sans-serif;
  background:radial-gradient(1400px 800px at 78% -12%,#18223D 0%,transparent 62%),radial-gradient(1100px 700px at -8% 112%,#1B1629 0%,transparent 60%),var(--bg)}
.scene{position:absolute;inset:0;visibility:hidden}
.abs{position:absolute}
.serif{font-family:"Noto Serif SC",serif}
.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.amber{color:var(--att)}
.tok{--h:212;display:inline-flex;align-items:center;justify-content:center;padding:.1em .42em;border-radius:.2em;font-weight:700;line-height:1.3;white-space:nowrap;
  background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));border:2px solid hsl(var(--h) var(--chip-s) var(--chip-bd-l));color:hsl(var(--h) var(--chip-s) var(--chip-fg-l))}
.tok.punct{background:#121827;border-color:var(--line-2);color:var(--muted)}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:22px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;border-radius:5px;overflow:hidden}
.strip i{display:block}
.track{background:var(--paper-2);border:1.5px solid var(--line-2);border-radius:7px;overflow:hidden}
.fill{display:block;height:100%;width:0;background:var(--vec);border-radius:5px}
.caret{display:inline-block;width:5px;height:1em;background:var(--att);vertical-align:-.12em;margin-left:6px}

#chrome{position:absolute;left:0;top:0;right:0;height:170px;z-index:5}
#c-step{position:absolute;left:120px;top:58px;font-size:24px;color:var(--att);letter-spacing:.06em}
#c-title{position:absolute;left:120px;top:92px;font-size:50px;font-weight:900}
#c-dots{position:absolute;right:120px;top:62px;display:flex;gap:10px}
#c-dots span{font-size:20px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line-2);color:var(--muted);background:rgba(20,26,40,.6)}
#c-dots span.on{background:var(--att);border-color:var(--att);color:#241400;font-weight:700}
#c-dots span.done{color:var(--ink-2);border-color:#4A5775}
#sub{position:absolute;left:0;right:0;bottom:52px;text-align:center;z-index:10}
#sub span{display:inline-block;max-width:1640px;font-size:40px;line-height:1.5;padding:10px 30px;border-radius:14px;background:rgba(4,7,13,.82);color:#F5F7FB;letter-spacing:.02em}
#fly{position:absolute;left:0;top:0;z-index:8;padding:.05em .38em;border-radius:.2em;background:var(--att);color:#241400;font-family:"Noto Serif SC",serif;font-weight:700;white-space:nowrap;opacity:0;box-shadow:0 14px 34px rgba(0,0,0,.45)}
#fade{position:absolute;inset:0;background:#000;z-index:20;pointer-events:none}

/* hook */
.bar-row{display:grid;grid-template-columns:190px 640px 110px;gap:22px;align-items:center;height:70px;font-size:40px}
.bar-row .lab{text-align:right;white-space:nowrap}
.bar-row .track{height:30px}
.bar-row .val{font-size:30px;color:var(--muted)}
.bar-row.pick .lab{color:var(--att);font-weight:700}
.bar-row.pick .fill{background:var(--att)}

/* tokenizer */
.tk{position:relative;display:inline-flex;flex-direction:column;align-items:center;line-height:1.25}
.tk .bgbox{position:absolute;inset:0;border-radius:18px;background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));border:2px solid hsl(var(--h) var(--chip-s) var(--chip-bd-l))}
.tk .tx{position:relative}
.tk .tid{position:relative;font-family:"JetBrains Mono",monospace;font-size:26px;font-weight:400;color:hsl(var(--h) 60% 78%)}

/* map */
.map-bg{fill:#0E1422;stroke:var(--line);stroke-width:1}
.pt text{font-size:17px;fill:var(--ink);font-family:"Noto Sans SC",sans-serif;font-weight:500}
.cl{font-size:13px;fill:var(--muted);letter-spacing:.3em;font-family:"Noto Sans SC",sans-serif}
.ring{fill:none;stroke:var(--att);stroke-width:2.5}

/* attention */
.at{display:flex;flex-direction:column;align-items:center;gap:8px}
.at .tok{font-size:38px;padding:6px 14px}
.at .w{font-size:21px;color:var(--muted);height:28px}
.arc{fill:none;stroke:var(--att);stroke-linecap:round}
.pr{display:grid;grid-template-columns:110px 520px 90px;gap:20px;align-items:center;height:52px;font-size:32px}
.pr .track{height:24px}
.pr .val{font-size:26px;color:var(--muted)}
.pr.pick .fill{background:var(--att)}
.pr.pick .lab{color:var(--att);font-weight:700}

/* qkv */
.qrow{display:grid;grid-template-columns:120px 330px 400px 120px;gap:22px;align-items:center;height:66px;font-size:30px}
.qrow .tok{font-size:30px;padding:3px 12px;justify-self:start}
.qrow .key{font-size:27px;color:var(--ink-2);white-space:nowrap}
.qrow .key b{font-family:"JetBrains Mono",monospace;font-size:18px;color:var(--vec);margin-right:8px;font-weight:600}
.qrow .track{height:24px}
.qrow .num{font-size:25px;color:var(--muted);text-align:right}
.steps div{font-size:32px;color:var(--muted);padding:10px 22px;border-radius:14px;margin-bottom:10px}
.steps div.on{background:var(--att-soft);color:var(--ink);box-shadow:inset 0 0 0 2px var(--att)}

/* ffn */
.wire{stroke:var(--line-2);stroke-width:.5;opacity:.45;fill:none}
.hot{stroke:var(--att);stroke-width:1.1;opacity:.55;fill:none}
.nr{stroke:var(--line-2);stroke-width:1.6}
.nl{font-size:12px;font-family:"JetBrains Mono",monospace;fill:#241400;text-anchor:middle;dominant-baseline:central;font-weight:600}
.cell{stroke:var(--line-2);stroke-width:1}
.fcap{font-size:13px;fill:var(--muted);font-family:"Noto Sans SC",sans-serif;text-anchor:middle}

/* tower */
.trow{display:grid;grid-template-columns:120px repeat(7,1fr);gap:10px;align-items:center;height:52px;padding:0 12px;border-radius:12px}
.trow .lab{font-size:22px;color:var(--muted);white-space:nowrap}
.tcell{position:relative;height:30px;border-radius:7px;border:1.5px dashed var(--line-2)}
.tcell i{position:absolute;inset:-1.5px;border-radius:7px}
.tcap{font-size:27px;color:var(--muted);padding:9px 18px;border-radius:12px;line-height:1.5;margin-bottom:6px}
.tcap b{font-family:"JetBrains Mono",monospace;font-size:20px;color:var(--ink-2);margin-right:12px}
.tcap.on{background:var(--att-soft);color:var(--ink)}

/* sampling */
.srow{display:grid;grid-template-columns:130px 90px 560px 110px 60px;gap:18px;align-items:center;height:54px;font-size:32px;padding:0 14px;border-radius:12px}
.srow .lg{font-size:24px;color:var(--muted);text-align:right}
.srow .track{height:24px}
.srow .pc{font-size:24px;text-align:right}
.srow.hi{background:var(--att-soft)}
.srow.win{background:var(--att-soft);box-shadow:inset 0 0 0 2.5px var(--att)}
.srow.win .fill{background:var(--att)}

/* loop */
.lnode{display:inline-flex;flex-direction:column;align-items:center;gap:8px}
.lnode .tok{font-size:50px;font-family:"Noto Serif SC",serif;padding:2px 16px}
.lnode .kv{font-family:"JetBrains Mono",monospace;font-size:17px;padding:1px 8px;border-radius:6px;border:1.5px solid var(--line-2);color:var(--muted)}
.bubble{padding:18px 26px;border-radius:24px;font-size:40px}
.bubble .who{display:block;font-size:20px;color:var(--muted);letter-spacing:.12em;margin-bottom:4px}

/* recap */
.pn{display:flex;flex-direction:column;gap:4px;padding:16px 20px;box-sizing:border-box;border-radius:18px;border:1.5px solid var(--line-2);background:var(--paper);min-width:132px;white-space:nowrap}
.pn small{font-family:"JetBrains Mono",monospace;font-size:18px;color:var(--muted)}
.pn b{font-family:"Noto Serif SC",serif;font-size:34px}
.pn em{font-style:normal;font-size:21px;color:var(--muted)}
.pn.on{background:var(--att-soft);border-color:var(--att)}
.pa{align-self:center;font-size:30px;color:var(--muted)}
</style>
</head>
<body>
<div id="stage">
  <div id="chrome"><div id="c-step"></div><div id="c-title" class="serif"></div><div id="c-dots"></div></div>
  <div id="scenes"></div>
  <div id="fly"></div>
  <div id="sub"><span></span></div>
  <div id="fade"></div>
</div>
<script>
'use strict';
/* ---------------- utils ---------------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lin = (t, a, b) => clamp((t - a) / (b - a));
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eo = x => 1 - Math.pow(1 - x, 3);
const bk = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const E = (t, a, b) => io(lin(t, a, b));
const EO = (t, a, b) => eo(lin(t, a, b));
const lerp = (a, b, k) => a + (b - a) * k;
const win = (t, a, b, f = .35) => Math.min(E(t, a, a + f), 1 - E(t, b - f, b));
const NS = 'http://www.w3.org/2000/svg';
const HUES = [212, 28, 152, 330, 262, 188, 46, 4, 120, 292, 236, 16, 170, 312];
const PUNCT = /^[，。！？、⟨]/;
function hash(str) { let x = 2166136261; for (const ch of str) { x ^= ch.codePointAt(0); x = Math.imul(x, 16777619); } return x >>> 0; }
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const tokenId = t => 100 + hash(t) % 99900;
function vecFor(word, n, base, noise) { const r = rng(hash(word) * 7 + 3); return Array.from({ length: n }, (_, i) => (base ? base[i] : 0) + (r() * 2 - 1) * (noise == null ? 1.1 : noise)); }
function cellColor(v) { const t = Math.min(1, Math.abs(v) / 1.3); const p = Math.round(8 + t * 84); return `color-mix(in srgb, var(${v >= 0 ? '--att' : '--vec'}) ${p}%, var(--paper-2))`; }
const solid = h => `hsl(${h} var(--chip-s) var(--chip-solid-l))`;
function softmax(xs, T) { const m = Math.max(...xs); const e = xs.map(x => Math.exp((x - m) / (T || 1))); const s = e.reduce((a, b) => a + b, 0); return e.map(x => x / s); }
const fmtP = p => p >= 10 ? Math.round(p) + '%' : p >= 0.1 ? p.toFixed(1) + '%' : '<0.1%';
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function tokHTML(t, h, extra = '', style = '') { return `<span class="tok${PUNCT.test(t) ? ' punct' : ''} ${extra}" style="--h:${h};${style}">${esc(t)}</span>`; }
function stripHTML(n, style) { return `<span class="strip" style="${style}">${'<i></i>'.repeat(n)}</span>`; }
function paintStrip(el, vals) { vals.forEach((v, i) => { const c = el.children[i]; if (c) c.style.background = cellColor(v); }); }
function sv(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
const R = el => el.getBoundingClientRect();
const op = (el, v) => { el.style.opacity = v.toFixed(3); };
const flyEl = document.getElementById('fly');
function flyAt(text, fromRect, toRect, k, fontSize, toMode) {
  flyEl.textContent = text; flyEl.style.fontSize = fontSize + 'px';
  const fw = flyEl.offsetWidth, fh = flyEl.offsetHeight;
  const x0 = fromRect.left + fromRect.width / 2 - fw / 2, y0 = fromRect.top + fromRect.height / 2 - fh / 2;
  const x1 = toMode === 'left' ? toRect.left : toRect.left + toRect.width / 2 - fw / 2, y1 = toRect.top + toRect.height / 2 - fh / 2;
  const e = io(k);
  const x = lerp(x0, x1, e), y = lerp(y0, y1, e) - Math.sin(Math.PI * e) * 110;
  flyEl.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(1 + .12 * Math.sin(Math.PI * e)).toFixed(3)})`;
  flyEl.style.opacity = 1;
}

/* ---------------- scenes ---------------- */
const SCENES = [];
const scenesEl = document.getElementById('scenes');
function scene(t0, t1, chrome, build, draw) {
  const el = document.createElement('div'); el.className = 'scene'; scenesEl.append(el);
  const s = { t0, t1, chrome, el, draw };
  build(el, s);
  SCENES.push(s);
}

/* 0 · title */
scene(0, 7, null, el => {
  el.innerHTML = `
  <div class="abs serif" data-k="t1" style="left:0;right:0;top:280px;text-align:center;font-size:94px;font-weight:900;line-height:1.3">大模型是怎样一个词一个词<br><span class="amber">「想」</span>出答案的</div>
  <div class="abs" data-k="t2" style="left:0;right:0;top:580px;text-align:center;font-size:36px;color:var(--muted);letter-spacing:.14em">Transformer 推理原理 · 动画图解</div>
  <div class="abs" data-k="t3" style="left:0;right:0;top:700px;display:flex;justify-content:center;gap:16px;font-size:44px;font-family:'Noto Serif SC',serif">
    ${['今天', '天气', '很好', '，', '我们', '一起', '去'].map((t, i) => tokHTML(t, HUES[i])).join('')}
    <span class="tok" style="--h:36;border-style:dashed;color:var(--att);background:transparent">？</span>
  </div>`;
}, (lt, t, s) => {
  const [t1, t2, t3] = ['t1', 't2', 't3'].map(k => s.el.querySelector(`[data-k=${k}]`));
  const a = E(lt, .3, 1.5); op(t1, a); t1.style.transform = `translateY(${(1 - a) * 36}px)`;
  op(t2, E(lt, 1.1, 2.1));
  Array.from(t3.children).forEach((c, i) => {
    const k = lin(lt, 2.1 + i * .16, 2.5 + i * .16);
    op(c, k); c.style.transform = `translateY(${(1 - eo(k)) * 24}px) scale(${i === 7 && lt > 4 ? 1 + .08 * Math.sin((lt - 4) * 6) : 1})`;
  });
});

/* 1 · hook: next-word guessing machine */
const HOOK = [
  { at: 12, c: [['公园', 38], ['爬山', 21], ['海边', 14], ['郊游', 11], ['逛街', 8]], pick: 0 },
  { at: 17, c: [['散步', 41], ['玩', 22], ['野餐', 17], ['吧', 9], ['看花', 6]], pick: 2 },
  { at: 22.5, c: [['吧', 46], ['。', 30], ['，', 12], ['好不好', 7], ['呀', 3]], pick: 0 },
  { at: 26.5, c: [['！', 52], ['。', 33], ['～', 9], ['？', 3], ['…', 2]], pick: 0 },
  { at: 29.5, c: [['⟨结束⟩', 91], ['你', 3], ['我们', 2], ['然后', 2], ['记得', 1]], pick: 0 }
];
scene(7, 33, { step: '开场', title: '大模型只做一件事：猜下一个词', dot: 0 }, el => {
  el.innerHTML = `
  <div class="abs serif" data-k="sent" style="left:160px;top:250px;font-size:68px;font-weight:700">
    <span>今天天气很好，我们一起去</span><span data-k="gen">${HOOK.slice(0, 4).map(r => `<span class="amber" style="display:inline-block">${r.c[r.pick][0]}</span>`).join('')}</span><span class="caret" data-k="caret"></span>
  </div>
  <div class="abs" data-k="bars" style="left:120px;top:430px">${'<div class="bar-row"><span class="lab"></span><span class="track"><span class="fill"></span></span><span class="val mono"></span></div>'.repeat(5)}</div>
  <div class="abs" style="left:1250px;top:430px;width:560px">
    <div class="serif" data-k="round" style="font-size:58px;font-weight:900"></div>
    <div data-k="status" style="font-size:32px;line-height:1.55;color:var(--ink-2);margin-top:14px"></div>
    <div data-k="note" style="font-size:28px;line-height:1.55;color:var(--att);margin-top:18px"></div>
  </div>`;
}, (lt, t, s) => {
  const q = k => s.el.querySelector(`[data-k=${k}]`);
  const gen = q('gen'), caret = q('caret'), bars = q('bars'), round = q('round'), status = q('status'), note = q('note');
  op(q('sent'), E(lt, .2, 1));
  let k = -1; HOOK.forEach((r, i) => { if (t >= r.at) k = i; });
  Array.from(gen.children).forEach((sp, i) => {
    const ta = HOOK[i].at + 2.6; const a = lin(t, ta, ta + .45);
    sp.style.display = t >= ta ? 'inline-block' : 'none';
    sp.style.transform = `scale(${lerp(.3, 1, bk(a)).toFixed(3)})`;
  });
  const ended = t >= HOOK[4].at + 2.2;
  op(caret, !ended && Math.floor(t * 2.2) % 2 === 0 ? 1 : 0);
  const rows = Array.from(bars.children);
  if (k < 0) {
    rows.forEach(r => op(r, 0));
    round.textContent = '准备'; status.textContent = '模型读完你输入的整句话，准备猜下一个词……'; note.textContent = '';
    op(round, E(lt, .8, 1.6)); op(status, E(lt, 1, 1.8));
    return;
  }
  op(round, 1); op(status, 1);
  const rd = HOOK[k], lt2 = t - rd.at;
  rows.forEach((r, i) => {
    op(r, 1);
    const [lab, , val] = r.children;
    lab.textContent = rd.c[i][0]; val.textContent = rd.c[i][1] + '%';
    r.querySelector('.fill').style.width = (rd.c[i][1] * EO(lt2, .1 + i * .08, .9 + i * .08)).toFixed(2) + '%';
    r.classList.toggle('pick', i === rd.pick && lt2 >= 1.5);
  });
  round.textContent = `第 ${k + 1} 轮`;
  const [pt, pp] = rd.c[rd.pick];
  const end = pt === '⟨结束⟩';
  if (lt2 < 1.5) { status.textContent = '读完整句，给候选词打分（只列前 5 名）'; note.textContent = ''; }
  else {
    status.textContent = end ? '抽中「结束」标记，这句话写完了。' : `按概率抽签，抽中「${pt}」（${pp}%）`;
    note.textContent = rd.pick ? '不是第一名也可能被抽中' : '';
    op(note, E(lt2, 1.8, 2.3));
  }
  if (!end && lt2 >= 1.9 && lt2 < 2.6) flyAt(pt, R(rows[rd.pick].children[0]), R(caret), lin(lt2, 1.9, 2.6), 68, 'left');
});

/* 2 · roadmap */
const STEPS = [['切词', '剪成词元'], ['向量', '意思坐标'], ['位置', '记住顺序'], ['注意力', '回头看上下文'], ['思考', '查一查记忆'], ['叠层', '反复几十层'], ['选词', '打分和抽签'], ['循环', '接回去再来']];
scene(33, 41, { step: '全景', title: '拆开这台「猜词机」：8 个步骤', dot: 0 }, el => {
  el.innerHTML = `
  <div class="abs" style="left:120px;top:300px;font-size:30px;color:var(--muted)" data-k="in">输入：一句话 ↓</div>
  <div class="abs" style="left:120px;top:370px;display:flex;gap:16px" data-k="row">
    ${STEPS.map((s, i) => `<div class="card" style="width:196px;height:230px;padding:22px 20px;box-sizing:border-box">
      <div class="mono amber" style="font-size:30px">${i + 1}</div>
      <div class="serif" style="font-size:40px;font-weight:900;margin-top:10px">${s[0]}</div>
      <div style="font-size:24px;color:var(--muted);margin-top:8px;line-height:1.4">${s[1]}</div></div>`).join('')}
  </div>
  <div class="abs" style="right:120px;top:640px;font-size:30px;color:var(--att)" data-k="out">↓ 输出：下一个词</div>`;
}, (lt, t, s) => {
  const q = k => s.el.querySelector(`[data-k=${k}]`);
  op(q('in'), E(lt, .3, 1));
  Array.from(q('row').children).forEach((c, i) => { const a = E(lt, .8 + i * .45, 1.3 + i * .45); op(c, a); c.style.transform = `translateY(${(1 - a) * 40}px)`; });
  op(q('out'), E(lt, 4.8, 5.6));
});

/* 3 · tokenize */
const TK1 = ['我', '爱', '吃', '苹果', '派'], TK2 = ['un', 'believ', 'able'];
scene(41, 60, { step: '第 1 步 / 共 8 步', title: '切词：把句子剪成「词元」', dot: 1 }, el => {
